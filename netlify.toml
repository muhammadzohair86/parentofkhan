
[build]
  command = "npm --prefix server install --include=dev && npm --prefix client install --include=dev && npm run build"
  publish = "client/dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,SAFEPAY_ENV"

[functions]
  directory = "server/netlify/functions"
  external_node_modules = ["express", "serverless-http"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
